<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · 学习积分日程表</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f5f6fb; color: #1d2033;
    font: 15px/1.7 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background: #0f1020; color: #eef0ff; } .card { background: #191b31 !important; border-color: #2a2c48 !important; } a { color: #b39dff !important; } .muted { color: #8b90b5 !important; } }
  .card {
    background: #fff; border: 1px solid #e6e8f3; border-radius: 18px; padding: 26px 24px;
    max-width: 420px; margin: 20px; box-shadow: 0 18px 50px rgba(37,41,82,.12); text-align: center;
  }
  .logo { font-size: 40px; }
  h1 { font-size: 19px; margin: 10px 0 6px; }
  p { margin: 6px 0; }
  .muted { color: #8b90a8; font-size: 13px; }
  a.btn {
    display: inline-block; margin-top: 16px; padding: 10px 18px; border-radius: 12px;
    background: linear-gradient(135deg, #6d5efc, #a78bfa); color: #fff; text-decoration: none; font-weight: 700;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🎯</div>
    <h1>这个网址没有对应的页面</h1>
    <p class="muted">可能是地址里多带了几个字符，或者链接不完整。</p>
    <p class="muted">如果你是从别人给的链接进来的，请回站点首页。</p>
    <a class="btn" id="home" href="./">回到首页</a>
  </div>
  <script>
    /* 找到站点根目录：GitHub Pages 项目站点形如 /仓库名/xxx */
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var root = location.origin + '/' + (parts.length ? parts[0] + '/' : '');
      var a = document.getElementById('home');
      a.href = root;
      setTimeout(function () { location.replace(root); }, 2500);
    })();
  </script>
</body>
</html>
